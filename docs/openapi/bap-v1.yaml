openapi: 3.0.3
info:
  title: Blueprint Agent Protocol (BAP) v1
  version: "2.0.0"
  description: |
    The API surface external autonomous agents (e.g. Hermes) use to operate
    Blueprint without the web dashboard. Mounted at `/api/bap/v1`.

    ## Authentication

    Every route except `POST /register` and `GET /discover` requires a
    `BAP-Key` header (or `Authorization: Bearer <key>`) with a key issued
    by `POST /register`. Keys look like `bap_<36 random base64url chars>`.

    `POST /register` itself requires **either** an authenticated dashboard
    session cookie, **or** a shared `X-Registration-Secret` header matching
    the operator-configured `BAP_REGISTRATION_SECRET` environment variable.
    It is never open to unauthenticated callers.

    Three `GET /agents-admin/*` routes use the dashboard's own session
    cookie instead of `BAP-Key` â€” they're operator-only and are documented
    separately at the bottom of this spec with the `sessionAuth` scheme.

    ## Idempotency

    Every mutating endpoint (`POST`/`PATCH` that creates or changes state)
    **requires** an `Idempotency-Key` header. Reusing the same key with an
    identical request body replays the original response instead of
    re-running the handler; reusing it with a different body returns `409`.
    A request with no `Idempotency-Key` header on a route that requires one
    returns `400`. See the `IdempotencyKey` parameter and `Conflict`
    response, referenced on every mutating operation below.

    ## Pagination

    Every list endpoint accepts `page` (default `1`) and `limit` (default
    `50`, max `200`) query parameters and returns a `pagination` object:
    `{page, limit, total, pages}`. Some endpoints additionally return a
    top-level `total` field for backward compatibility with earlier,
    pre-Phase-2 response shapes â€” both always agree.

    ## Timestamps

    Every timestamp in every response is normalized to ISO-8601
    (`Date.toISOString()` format, e.g. `2026-01-15T07:23:41.000Z`) at the
    API boundary, regardless of how the underlying column stores it.

    ## Request / correlation IDs

    Every response carries an `X-Request-Id` header (unique per call) and
    an `X-Correlation-Id` header (defaults to the request ID; supply your
    own via a request `X-Correlation-Id` header to tie a multi-call
    workflow together for debugging). Both are persisted in the
    `bap_audit` table server-side.

    ## Errors

    Every error response has the shape `{error, code, request_id}` at
    minimum (`error` is a human-readable string; `code` is one of
    `validation_error | not_found | permission_denied | conflict |
    rate_limited | internal_error`, new as of Phase 2 â€” treat as
    best-effort/additive, some older routes may omit `code`/`request_id`).

  contact:
    name: Blueprint
servers:
  - url: /api/bap/v1
    description: Relative to your Blueprint instance's base URL (BLUEPRINT_URL)

security:
  - bapKey: []

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
components:
  securitySchemes:
    bapKey:
      type: apiKey
      in: header
      name: BAP-Key
      description: A key issued by POST /register. Authorization Bearer <key> is also accepted.
    registrationSecret:
      type: apiKey
      in: header
      name: X-Registration-Secret
      description: Shared secret configured via BAP_REGISTRATION_SECRET. Only required if not using a dashboard session.
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Dashboard session cookie â€” operator-only routes (/agents-admin/*), not part of the external-agent BAP surface.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Required on every mutating endpoint. See the top-level Idempotency section.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string }
      description: Optional â€” ties this call to others in the same logical workflow. Echoed back and persisted.
    BusinessIdPath:
      name: businessId
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: "Task 'tsk_xxx' not found.", code: not_found, request_id: "..." }
    PermissionDenied:
      description: The caller's key lacks the required permission, or the resource belongs to a business outside the key's business_access.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: "Permission denied: task does not belong to an authorized business.", code: permission_denied, request_id: "..." }
    ValidationError:
      description: The request body or query parameters are invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    IdempotencyKeyRequired:
      description: The Idempotency-Key header was missing.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: "Idempotency-Key header is required for this endpoint." }
    Conflict:
      description: |
        Either the same Idempotency-Key was reused with a different request
        body, or a request with the same key is still being processed
        (retryable: true in the body), or the resource is not in a state
        that allows this action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many requests. See Retry-After.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, enum: [validation_error, not_found, permission_denied, conflict, rate_limited, internal_error] }
        request_id: { type: string, nullable: true }
        retryable: { type: boolean }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        pages: { type: integer }

    Task:
      type: object
      properties:
        id: { type: string }
        business_id: { type: string }
        signal_id: { type: string, nullable: true }
        mission_id: { type: string, nullable: true }
        project_id: { type: string, nullable: true }
        parent_task_id: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        proposed_by: { type: string }
        assigned_to: { type: string, nullable: true }
        action_type: { type: string, nullable: true }
        action_payload: { type: object }
        status: { $ref: '#/components/schemas/TaskStatus' }
        trust_tier: { type: string, enum: [green, yellow, red] }
        priority: { type: string, enum: [p1, p2, p3] }
        confidence: { type: number, nullable: true }
        estimated_impact: { type: string, nullable: true }
        outcome: { type: string, nullable: true }
        outcome_data: { type: object, nullable: true }
        target_metric: { type: string, nullable: true }
        target_metric_baseline: { type: number, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        approved_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }

    TaskStatus:
      type: string
      enum: [proposed, approved, executing, complete, verified, failed, blocked, rejected, cancelled, manual_review, deferred, draft_ready]

    TaskDetail:
      type: object
      properties:
        task: { $ref: '#/components/schemas/Task' }
        approval:
          type: object
          properties:
            status: { type: string }
            approved_by: { type: string, nullable: true }
            approved_at: { type: string, format: date-time, nullable: true }
            rejection_reason: { type: string, nullable: true }
            trust_tier: { type: string }
            approval_mode: { type: string }
        execution:
          type: object
          properties:
            status: { type: string }
            started_at: { type: string, format: date-time, nullable: true }
            completed_at: { type: string, format: date-time, nullable: true }
            active_job_id: { type: string, nullable: true }
            jobs: { type: array, items: { $ref: '#/components/schemas/ExecutionJob' } }
        linked_signal: { type: object, nullable: true }
        linked_goals: { type: array, items: { type: object } }
        dependencies:
          type: object
          properties:
            parent_task: { type: object, nullable: true }
            child_tasks: { type: array, items: { type: object } }
        outcome:
          type: object
          properties:
            target_metric: { type: string, nullable: true }
            target_metric_baseline: { type: number, nullable: true }
            checks: { type: array, items: { type: object } }
            status: { $ref: '#/components/schemas/OutcomeStatus' }
            is_final: { type: boolean }
        audit_summary:
          type: object
          properties:
            total_events: { type: integer }
            last_action: { type: object, nullable: true }

    ExecutionJob:
      type: object
      properties:
        id: { type: string }
        task_id: { type: string }
        business_id: { type: string }
        action_type: { type: string, nullable: true }
        status: { type: string, enum: [queued, leased, executing, succeeded, failed, dead_letter, manual_review, cancelled] }
        attempt_count: { type: integer }
        max_attempts: { type: integer }
        lease_owner: { type: string, nullable: true }
        lease_expires_at: { type: string, format: date-time, nullable: true }
        external_reference: { type: object, nullable: true }
        last_error: { type: string, nullable: true }
        result: { type: object, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Signal:
      type: object
      properties:
        id: { type: string }
        business_id: { type: string }
        connector_id: { type: string, nullable: true }
        rule_id: { type: string }
        type: { type: string, enum: [anomaly, opportunity, risk, correlation] }
        severity: { type: string, enum: [info, warning, alert, critical] }
        title: { type: string }
        description: { type: string, nullable: true }
        data: { type: object }
        status: { type: string, enum: [open, resolved, snoozed] }
        confidence: { type: number, nullable: true }
        attribution_primary_cause: { type: string, nullable: true }
        attribution_primary_confidence: { type: number, nullable: true }
        attribution_recommendation: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }

    SignalDetail:
      type: object
      properties:
        signal: { $ref: '#/components/schemas/Signal' }
        evidence: { type: object, description: "Alias for signal.data" }
        attribution:
          type: object
          properties:
            primary_cause: { type: string, nullable: true }
            primary_confidence: { type: number, nullable: true }
            recommendation: { type: string, nullable: true }
            analysis: { type: object, nullable: true }
        related_signals:
          type: array
          items:
            allOf:
              - type: object
                properties: { relation: { type: string, enum: [cluster, same_detector] }, cluster_id: { type: string } }
              - { type: object }
        related_tasks: { type: array, items: { type: object } }
        connector_freshness: { type: object, nullable: true }
        resolution_history: { type: array, items: { type: object } }

    Goal:
      type: object
      properties:
        id: { type: string }
        business_id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, paused, achieved, missed, cancelled] }
        created_by: { type: string }
        assigned_agents: { type: array, items: { type: string } }
        deadline: { type: string, format: date-time, nullable: true }
        metric_name: { type: string, nullable: true }
        metric_baseline: { type: number, nullable: true }
        metric_target: { type: number, nullable: true }
        metric_current: { type: number, nullable: true }
        metric_unit: { type: string, nullable: true }
        progress_pct: { type: number }
        last_checked: { type: string, format: date-time, nullable: true }
        achieved_at: { type: string, format: date-time, nullable: true }
        strategy: { type: string, nullable: true }
        milestones: { type: array, items: { type: object }, description: "Merges the real goal_milestones table (Phase 3) with any legacy free-form JSON milestones." }
        dependencies:
          type: array
          description: "Phase 3 â€” real goal-to-goal dependencies from goal_dependencies, replacing the earlier project_id-only proxy."
          items:
            type: object
            properties:
              goal_id: { type: string, description: "The goal this goal depends on." }
              title: { type: string }
              status: { type: string }
              progress_pct: { type: number, nullable: true }
              note: { type: string, nullable: true }
        notes: { type: array, items: { type: object } }
        tags: { type: array, items: { type: string } }
        project_id: { type: string, nullable: true }
        owner: { type: string, nullable: true, description: "Phase 3." }
        confidence: { type: number, nullable: true, description: "Phase 3." }
        priority: { type: string, enum: [p1, p2, p3], default: p2, description: "Phase 3." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Conflict:
      type: object
      properties:
        id: { type: string }
        conflict_type: { type: string }
        severity: { type: string }
        entity_a_type: { type: string }
        entity_a_id: { type: string }
        entity_a_title: { type: string, nullable: true }
        entity_b_type: { type: string }
        entity_b_id: { type: string }
        entity_b_title: { type: string, nullable: true }
        description: { type: string }
        recommendation: { type: string, nullable: true }
        status: { type: string, enum: [open, resolved] }
        detected_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }

    Connector:
      type: object
      description: credentials is never included in any BAP response, at the SQL level (never selected).
      properties:
        id: { type: string }
        business_id: { type: string }
        type: { type: string }
        name: { type: string }
        status: { type: string, enum: [live, stale, error, disconnected], description: "Live-computed freshness status â€” see raw_status for the underlying DB column." }
        raw_status: { type: string, description: "The unprocessed connectors.status DB column value." }
        last_sync: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        config_summary: { type: object, description: "Whitelisted non-secret config fields only." }
        hours_since_sync: { type: number, nullable: true }
        next_sync_in_minutes: { type: integer, nullable: true }
        stale_threshold_hours: { type: integer }
        created_at: { type: string, format: date-time }

    OutcomeStatus:
      type: string
      nullable: true
      enum: [pending, measuring, successful, neutral, unsuccessful, abandoned]
      description: |
        Mapped from the underlying task_outcomes.verdict vocabulary
        (improved/worsened/no_change) â€” null means the task was never
        eligible for outcome tracking (no target_metric).

    Outcome:
      type: object
      properties:
        task_id: { type: string }
        task_title: { type: string }
        action_type: { type: string, nullable: true }
        proposed_by: { type: string }
        status: { $ref: '#/components/schemas/OutcomeStatus' }
        is_final: { type: boolean, description: "True once a 4-week (or later) check exists." }
        target_metric: { type: string, nullable: true }
        baseline: { type: number, nullable: true }
        checks: { type: array, items: { type: object } }
        latest: { type: object, nullable: true }

    AgentRun:
      type: object
      properties:
        id: { type: string }
        agent_id: { type: string }
        business_id: { type: string }
        trigger: { type: string }
        trigger_id: { type: string, nullable: true }
        status: { type: string, enum: [running, complete, failed, skipped, cancelled] }
        cost_usd: { type: number, nullable: true }
        signals_detected: { type: integer }
        tasks_proposed: { type: integer }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }

    AuditEntry:
      type: object
      properties:
        id: { type: string }
        entity_type: { type: string, enum: [task, signal, business, connector, agent, agent_file, server_file] }
        entity_id: { type: string }
        action: { type: string }
        actor: { type: string }
        before_state: { type: object, nullable: true, description: "Key-shaped redaction applied â€” see spec description." }
        after_state: { type: object, nullable: true }
        metadata: { type: object, nullable: true }
        created_at: { type: string, format: date-time }

    # â”€â”€ Phase 3 â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    Opportunity:
      type: object
      description: "Backed by goal_suggestions (server/brain/goal-suggester.ts), extended in Phase 3."
      properties:
        id: { type: string }
        business_id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        opportunity_value: { type: number, nullable: true }
        opportunity_unit: { type: string, default: gbp_per_month }
        metric_name: { type: string, nullable: true }
        current_value: { type: number, nullable: true }
        target_value: { type: number, nullable: true }
        barrier: { type: string, nullable: true }
        suggested_deadline: { type: string, format: date-time, nullable: true }
        suggested_agents: { type: array, items: { type: string } }
        suggested_workflow_id: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        connector_source: { type: string, nullable: true }
        evidence: { type: object }
        status: { type: string, default: pending }
        snoozed_until: { type: string, format: date-time, nullable: true }
        dismissed_reason: { type: string, nullable: true }
        accepted_goal_id: { type: string, nullable: true }
        required_effort: { type: string, nullable: true, description: "Phase 3 addition." }
        related_goal_ids: { type: array, items: { type: string }, description: "Phase 3 addition." }
        related_risks: { type: array, items: { type: object }, description: "Phase 3 addition." }
        why_it_matters: { type: string, nullable: true, description: "Phase 3 addition." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Decision:
      type: object
      description: "Read-only from BAP â€” written by decision-memory.ts's recordDecision(), called by the engine that made the decision (task-queue.ts, goal-reasoner.ts, conflict-engine.ts, goal-suggester.ts)."
      properties:
        id: { type: string }
        business_id: { type: string }
        decision_type:
          type: string
          enum: [task_approval, task_rejection, task_cancellation, strategy_selection, goal_creation, goal_status_change, conflict_resolution, conflict_dismissal, opportunity_accepted, opportunity_dismissed, manual]
        title: { type: string }
        decision: { type: string }
        reasoning: { type: string, nullable: true }
        evidence: { type: array, items: { type: object } }
        confidence: { type: number, nullable: true }
        alternatives_rejected: { type: array, items: { type: object } }
        author: { type: string }
        related_goal_id: { type: string, nullable: true, description: "Soft reference â€” not a foreign key." }
        related_task_id: { type: string, nullable: true }
        related_signal_id: { type: string, nullable: true }
        related_outcome_id: { type: string, nullable: true }
        related_conflict_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    GraphNode:
      type: object
      properties:
        id: { type: string, description: "kg_entities.id, an opaque graph node id â€” not the same as ref_id." }
        entity_type: { type: string, description: "e.g. goal, task, signal, decision, or a standalone type (competitor, product, customer, campaign, person)." }
        label: { type: string }
        ref_table: { type: string, nullable: true, description: "The backing table (goals/tasks/signals/decisions/...), null for standalone entities." }
        ref_id: { type: string, nullable: true }

    GraphEdge:
      type: object
      properties:
        id: { type: string }
        from_entity_id: { type: string }
        to_entity_id: { type: string }
        edge_type:
          type: string
          enum: [caused, supports, blocks, depends_on, relates_to, mentions, supersedes, contradicts, improves, regresses]
        weight: { type: number, default: 1.0 }
        evidence: { type: string, nullable: true }

    Recommendation:
      type: object
      description: "getRankedRecommendations() output, enriched with an explanation object per item (server/routes/bap-review.ts explainRecommendation())."
      properties:
        id: { type: string }
        source_type: { type: string, enum: [task, opportunity, strategy] }
        title: { type: string }
        score: { type: number }
        rationale: { type: array, items: { type: string } }
        expected_impact: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        estimated_cost: { type: number, nullable: true }
        estimated_effort: { type: string, nullable: true }
        historical_success_rate: { type: number, nullable: true }
        historical_sample_size: { type: integer }
        goal_id: { type: string, nullable: true }
        goal_title: { type: string, nullable: true }
        has_open_conflict: { type: boolean }
        explanation:
          type: object
          properties:
            evidence: { type: array, items: { type: string } }
            reasoning: { type: array, items: { type: string } }
            alternatives_considered: { type: array, items: { type: object } }
            confidence: { type: number, nullable: true }
            risk: { type: string }
            expected_impact: { type: string, nullable: true }
            historical_evidence:
              type: object
              properties:
                success_rate: { type: number, nullable: true }
                sample_size: { type: integer }
            linked_kb: { type: array, items: { type: object }, description: "Only populated for the top 5 (explanation_depth) â€” [] otherwise, not missing/omitted." }
            linked_signals: { type: array, items: { type: object } }
            linked_metrics: { type: object, nullable: true }

    ExcludedRecommendation:
      type: object
      properties:
        id: { type: string }
        source_type: { type: string, enum: [task, opportunity, strategy] }
        title: { type: string }
        reason: { type: string, description: "The blocking constraint's note, or a generic fallback." }

    RetrospectiveSummary:
      type: object
      properties:
        id: { type: string }
        business_id: { type: string }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        executive_summary: { type: string, nullable: true }
        kb_path: { type: string, nullable: true }
        triggered_by: { type: string, default: scheduler }
        created_at: { type: string, format: date-time }

    RetrospectiveDetail:
      allOf:
        - { $ref: '#/components/schemas/RetrospectiveSummary' }
        - type: object
          properties:
            what_worked: { type: array, items: { type: object } }
            what_didnt: { type: array, items: { type: object } }
            learnings: { type: array, items: { type: object } }
            agent_assessments: { type: array, items: { type: object } }
            open_windows: { type: array, items: { type: object } }
            recommendations: { type: array, items: { type: object } }
            operating_changes: { type: array, items: { type: object } }
            calibration_notes: { type: array, items: { type: object } }
            full_report_json: { type: object, nullable: true }

    CalibrationRow:
      type: object
      properties:
        id: { type: string }
        agent_id: { type: string }
        business_id: { type: string, nullable: true }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        tasks_with_outcomes: { type: integer }
        avg_stated_confidence: { type: number, nullable: true }
        avg_actual_outcome_rate: { type: number, nullable: true }
        calibration_error: { type: number, nullable: true }
        calibration_score: { type: number, nullable: true }
        calibration_offset: { type: number, default: 0 }
        trend: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        false_positives: { type: integer, default: 0 }
        false_negatives: { type: integer, default: 0 }
        recommendations_accepted: { type: integer, default: 0 }
        recommendations_rejected: { type: integer, default: 0 }
        execution_success_rate: { type: number, nullable: true }
        long_term_success_rate: { type: number, nullable: true }
        calibration_method: { type: string, default: simple_average, description: "'simple_average' marks rows computed before Phase 3's richer calibration existed." }
        conservatism_factor: { type: number, default: 1.0 }
        bins: { type: array, items: { type: object } }
        calculated_at: { type: string, format: date-time }

    CrossBusinessPattern:
      type: object
      description: "No business_id, name, URL, or task title â€” enforced structurally, the underlying table has no such column."
      properties:
        pattern_key: { type: string }
        action_type: { type: string }
        description: { type: string }
        sample_size: { type: integer }
        success_count: { type: integer }
        success_rate: { type: number, nullable: true }
        applicable_business_types: { type: array, items: { type: string }, description: "Business types (e.g. ecommerce, saas), never names." }

    GoalAssessment:
      type: object
      description: "One row per strategic-planning pass (goal-reasoner.ts) â€” append-only history, not overwritten."
      properties:
        id: { type: string }
        goal_id: { type: string }
        business_id: { type: string }
        feasibility_verdict: { type: string, nullable: true }
        feasibility_confidence: { type: number, nullable: true }
        feasibility_reasoning: { type: string, nullable: true }
        key_constraint: { type: string, nullable: true }
        expected_impact: { type: string, nullable: true }
        gap_analysis: { type: object, nullable: true }
        assumptions: { type: array, items: { type: object } }
        risks: { type: array, items: { type: object } }
        dependencies: { type: array, items: { type: object } }
        measurement_plan: { type: object, nullable: true }
        success_criteria: { type: array, items: { type: object } }
        recommended_strategy_id: { type: string, nullable: true }
        created_by: { type: string, default: goal-reasoner }
        created_at: { type: string, format: date-time }

    GoalStrategy:
      type: object
      description: "One durable, individually comparable candidate path per goal â€” previously only existed inside a JSON blob and a rendered KB page."
      properties:
        id: { type: string }
        goal_id: { type: string }
        business_id: { type: string }
        assessment_id: { type: string, nullable: true }
        name: { type: string }
        summary: { type: string, nullable: true }
        expected_impact_summary: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        estimated_effort: { type: string, nullable: true }
        estimated_cost: { type: number, nullable: true }
        estimated_cost_unit: { type: string, default: gbp }
        time_to_impact_days: { type: integer, nullable: true }
        historical_success_rate: { type: number, nullable: true }
        historical_sample_size: { type: integer, default: 0 }
        evidence: { type: array, items: { type: object } }
        depends_on: { type: array, items: { type: string } }
        is_recommended: { type: boolean }
        status: { type: string, default: candidate }
        created_at: { type: string, format: date-time }

    TimelineEvent:
      type: object
      description: "One merged, chronological feed â€” GET /goals/{goalId}/timeline."
      properties:
        at: { type: string, format: date-time, nullable: true }
        type: { type: string, enum: [goal_created, progress_check, strategic_assessment, strategy_proposed, conflict_detected, decision, goal_achieved] }
        summary: { type: string }
        data: { type: object, description: "The underlying row this event summarizes." }

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
paths:
  /businesses/{businessId}/capabilities:
    get:
      summary: List business capabilities
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      responses:
        '200': { description: Capability registry rows for the business. }
    post:
      summary: Confirm or update a business capability
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Updated capability row. }
  /businesses/{businessId}/capabilities/propose:
    post:
      summary: Propose a capability correction without mutating facts
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: Proposed correction row. }
  /businesses/{businessId}/applicability/evaluate:
    post:
      summary: Evaluate whether a candidate applies to this business
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Applicability status, capability keys and reason. }
  /businesses/{businessId}/suppressions:
    get:
      summary: List active applicability suppressions
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      responses:
        '200': { description: Suppression records. }
  /businesses/{businessId}/corrections:
    get:
      summary: List human corrections
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      responses:
        '200': { description: Correction history. }
  /businesses/{businessId}/corrections/propose:
    post:
      summary: Propose a human correction for review
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: Proposed correction row; does not mutate capability state. }
  /businesses/{businessId}/revenue-paths:
    get:
      summary: List revenue paths
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      responses:
        '200': { description: Revenue path rows. }
    post:
      summary: Create or update a revenue path
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Updated revenue path. }
  /businesses/{businessId}/measurement-policies:
    get:
      summary: List outcome measurement policies
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      responses:
        '200': { description: Measurement policies. }
  /businesses/{businessId}/approval-policies:
    get:
      summary: Read approval policy tiers and defaults
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      responses:
        '200': { description: Approval tier defaults. }
  /provider-preflight:
    get:
      summary: Read provider/model preflight cache
      responses:
        '200': { description: Preflight cache rows. }
  /businesses/{businessId}/scorecards:
    get:
      summary: Read agent scorecards
      parameters:
        - $ref: '#/components/parameters/BusinessIdPath'
      responses:
        '200': { description: Agent scorecard metrics, calibration, uncertainty and policy effects. }

  /register:
    post:
      operationId: register
      summary: Register a new BAP agent and issue an API key
      security:
        - registrationSecret: []
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                owner: { type: string }
                requested_permissions: { type: array, items: { type: string }, description: "Filtered server-side against a grantable allow-list; wildcards (*:*, resource:*) are never granted." }
                business_access: { type: array, items: { type: string }, description: "Filtered to businesses that exist; '*' is never granted." }
                webhook_url: { type: string }
                webhook_events: { type: array, items: { type: string } }
      responses:
        '201':
          description: Agent registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id: { type: string }
                  api_key: { type: string, description: "Shown once only." }
                  api_key_prefix: { type: string }
                  permissions: { type: array, items: { type: string } }
                  business_access: { type: array, items: { type: string } }
                  webhook_secret: { type: string, nullable: true }
        '401': { description: Unauthenticated â€” no session and no valid X-Registration-Secret. }

  /discover:
    get:
      operationId: discover
      summary: Public instance capability discovery (no auth)
      security: []
      responses:
        '200': { description: Instance name, businesses, connectors, capabilities. }
        '404': { description: Discovery disabled by the operator. }

  /me:
    get:
      operationId: whoami
      summary: Current agent's identity, permissions, and accessible businesses
      responses:
        '200': { description: OK }

  /capabilities:
    get:
      operationId: capabilities
      summary: Instance-wide capability info (connected connectors, active internal agents)
      responses:
        '200': { description: OK }

  /businesses/{businessId}/health:
    get:
      operationId: getBusinessHealth
      summary: Full business health snapshot (score, signals, tasks, metrics, agent activity)
      x-bap-permission: signals:read
      parameters: [{ $ref: '#/components/parameters/BusinessIdPath' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  /businesses/{businessId}/signals:
    get:
      operationId: listSignals
      summary: List signals â€” search, filter, paginate
      x-bap-permission: signals:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string }, description: "Full-text search over title/description." }
        - { name: severity, in: query, schema: { type: string }, description: "CSV: info,warning,alert,critical" }
        - { name: status, in: query, schema: { type: string, default: open }, description: "CSV, or 'all'." }
        - { name: connector, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string }, description: "CSV: anomaly,opportunity,risk,correlation" }
        - { name: created_from, in: query, schema: { type: string, format: date-time } }
        - { name: created_to, in: query, schema: { type: string, format: date-time } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, resolved_at, severity, confidence], default: created_at } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  signals: { type: array, items: { $ref: '#/components/schemas/Signal' } }
                  total: { type: integer, description: "Backward-compat alias for pagination.total" }
                  filters_applied: { type: object }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      operationId: createSignal
      summary: Create a signal (tell Blueprint about something detected externally)
      x-bap-permission: signals:create
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, severity, title]
              properties:
                type: { type: string, enum: [anomaly, opportunity, risk, correlation] }
                severity: { type: string, enum: [info, warning, alert, critical] }
                title: { type: string }
                description: { type: string }
                data: { type: object }
                confidence: { type: number }
                connector_id: { type: string }
      responses:
        '201': { description: "Created. { signal_id, created: true }" }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '409': { $ref: '#/components/responses/Conflict' }

  /signals/{signalId}:
    get:
      operationId: getSignalDetail
      summary: Signal detail â€” evidence, attribution, related signals/tasks, connector freshness, resolution history
      x-bap-permission: signals:read
      parameters: [{ name: signalId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignalDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
    patch:
      operationId: patchSignalStatus
      summary: Update a signal's status (e.g. acknowledge, resolve, snooze, dismiss)
      x-bap-permission: signals:read
      description: >-
        Despite mutating state, this route is gated by `signals:read` (not a
        `signals:update` permission, which does not exist) â€” this matches the
        actual server implementation exactly. The idempotency store keys on
        the internal scope string `"signals:update"`, but that is not a
        checked permission.
      parameters:
        - { name: signalId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, description: "e.g. open, acknowledged, resolved, snoozed, dismissed. Setting 'resolved' also stamps resolved_at." }
                note: { type: string }
      responses:
        '200': { description: "{ signal_id, status, updated: true }" }
        '400':
          description: Missing status, or missing Idempotency-Key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{taskId}:
    get:
      operationId: getTaskDetail
      summary: Task detail â€” approval status, execution state, linked signal/goals/jobs, outcome, audit summary
      x-bap-permission: tasks:read
      parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
    patch:
      operationId: patchTask
      summary: Approve, reject, or cancel a task
      x-bap-permission: tasks:approve
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject, cancel] }
                note: { type: string }
                reason: { type: string, description: "Used for cancel; note is used for approve/reject." }
      responses:
        '200': { description: "{ task_id, status, action }" }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '422': { description: "Task is not in a state that allows this action (e.g. cancelling an executing task)." }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{taskId}/history:
    get:
      operationId: getTaskHistory
      summary: Task narrative timeline (task_events)
      x-bap-permission: tasks:read
      parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "{ task_id, events: [...] }" }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /tasks/{taskId}/outcome:
    get:
      operationId: getTaskOutcome
      summary: Single-task outcome detail â€” baseline, checks, confidence, recommendation
      x-bap-permission: outcomes:read
      parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Outcome' }
                  - type: object
                    properties:
                      linked_task: { type: string }
                      confidence:
                        type: object
                        properties:
                          stated: { type: number, nullable: true }
                          calibrated: { type: number, nullable: true }
                          agent_calibration: { type: object, nullable: true }
                      recommendation:
                        type: object
                        nullable: true
                        properties:
                          action_type: { type: string }
                          sample_size: { type: integer }
                          success_rate: { type: number, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /businesses/{businessId}/tasks:
    get:
      operationId: listTasks
      summary: List tasks â€” search, filter, sort, paginate
      x-bap-permission: tasks:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string } }
        - { name: action_type, in: query, schema: { type: string } }
        - { name: created_by, in: query, schema: { type: string } }
        - { name: assigned_agent, in: query, schema: { type: string } }
        - { name: signal_id, in: query, schema: { type: string } }
        - { name: goal_id, in: query, schema: { type: string }, description: "Best-effort: resolved via the goal's project_id, not a direct FK." }
        - { name: created_from, in: query, schema: { type: string, format: date-time } }
        - { name: created_to, in: query, schema: { type: string, format: date-time } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, updated_at, priority, status, confidence] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }
                  total: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      operationId: proposeTask
      summary: Propose a task for human approval
      x-bap-permission: tasks:propose
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                action_type: { type: string }
                priority: { type: string, enum: [p1, p2, p3], default: p2 }
                confidence: { type: number }
                estimated_impact: { type: string }
                signal_id: { type: string }
                assigned_to: { type: string }
                action_payload: { type: object }
      responses:
        '201': { description: "{ task_id, status, trust_tier, approval_required: true }" }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '409': { $ref: '#/components/responses/Conflict' }

  /businesses/{businessId}/execution-jobs:
    get:
      operationId: listExecutionJobs
      summary: List durable execution jobs (Phase 1 â€” approval â†’ job â†’ worker)
      x-bap-permission: tasks:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/ExecutionJob' } }
                  total: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }

  /execution-jobs/{jobId}:
    get:
      operationId: getExecutionJob
      summary: Execution job detail
      x-bap-permission: tasks:read
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "{ job }" }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /execution-jobs/{jobId}/retry:
    post:
      operationId: retryExecutionJob
      summary: Retry a dead-lettered/manual-review/cancelled execution job
      x-bap-permission: tasks:approve
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: "{ job_id, status: 'queued', retried: true }" }
        '409': { description: "Job is not in a retryable state." }

  /execution-jobs/{jobId}/cancel:
    post:
      operationId: cancelExecutionJob
      summary: Cancel a queued/manual-review execution job
      x-bap-permission: tasks:approve
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: "{ job_id, status: 'cancelled', cancelled: true }" }
        '409': { description: "Job is not in a cancellable state." }

  /businesses/{businessId}/kb/file/{+path}:
    get:
      operationId: readKbFile
      summary: Read a knowledge-base file by path
      x-bap-permission: kb:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { name: path, in: path, required: true, schema: { type: string }, description: "Wildcard â€” the KB-relative file path." }
      responses:
        '200': { description: File content + frontmatter + backlinks. }
        '400': { description: "Path escapes the KB root â€” see containPath() in kb-engine.ts." }
        '404': { $ref: '#/components/responses/NotFound' }

  /businesses/{businessId}/kb/search:
    get:
      operationId: searchKb
      summary: Keyword search over KB documents
      x-bap-permission: kb:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: "{ results, query }" }

  /businesses/{businessId}/kb/query:
    post:
      operationId: queryKb
      summary: Ask a question, grounded and answered from the KB (LLM)
      x-bap-permission: kb:read
      parameters: [{ $ref: '#/components/parameters/BusinessIdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
                file_result: { type: boolean }
                context: { type: string }
      responses:
        '200': { description: "{ answer, sources_read, filed_as }" }

  /businesses/{businessId}/kb/write:
    post:
      operationId: writeKb
      summary: Write/create a knowledge-base page
      x-bap-permission: kb:write
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              properties:
                path: { type: string }
                content: { type: string }
                frontmatter: { type: object }
                commit_message: { type: string }
      responses:
        '200': { description: Written file metadata. }
        '400': { description: "Path escapes the KB root, or Idempotency-Key missing." }
        '409': { $ref: '#/components/responses/Conflict' }

  /businesses/{businessId}/metrics:
    get:
      operationId: listMetrics
      summary: Raw connector metrics
      x-bap-permission: metrics:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { name: connector, in: query, schema: { type: string } }
        - { name: metric, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { description: "{ metrics: [...] }" }

  /businesses/{businessId}/metrics/snapshot:
    get:
      operationId: metricsSnapshot
      summary: Latest metric value per connector
      x-bap-permission: metrics:read
      parameters: [{ $ref: '#/components/parameters/BusinessIdPath' }]
      responses:
        '200': { description: "{ snapshot_at, connectors: {...} }" }

  /businesses/{businessId}/agents:
    get:
      operationId: listInternalAgents
      summary: List Blueprint's internal agents (business-scoped stats)
      x-bap-permission: agents:read
      parameters: [{ $ref: '#/components/parameters/BusinessIdPath' }]
      responses:
        '200': { description: "{ agents: [...] }" }

  /businesses/{businessId}/agents/{agentId}/run:
    post:
      operationId: triggerAgentRun
      summary: Trigger an internal agent to run now
      x-bap-permission: agents:trigger
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { name: agentId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        '202': { description: "{ run_id, agent_id, status: 'queued', estimated_start: 'immediate' }" }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{runId}:
    get:
      operationId: getRunDetail
      summary: Single agent-run detail
      x-bap-permission: agents:read
      parameters: [{ name: runId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Curated run detail (reasoning, cost, tasks_proposed, signals_detected). }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /businesses/{businessId}/runs:
    get:
      operationId: listAgentRuns
      summary: List agent runs â€” filter by agent_id/status/trigger, paginated
      x-bap-permission: agents:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: trigger, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs: { type: array, items: { $ref: '#/components/schemas/AgentRun' } }
                  total: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }

  /runs/{runId}/cancel:
    post:
      operationId: cancelRun
      summary: Mark a running agent run as cancelled (DB-status flip only â€” see description)
      description: |
        This does NOT interrupt an in-flight LLM call or task creation
        already under way â€” server/agents/agent-runner.ts's runAgent() has
        no abort signal or mid-run checkpoint. It stops Blueprint from
        treating the run as active for tracking/cost-cap purposes.
      x-bap-permission: agents:trigger
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: "{ run_id, status: 'cancelled', note }" }
        '409': { description: "Run is not in 'running' status." }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{runId}/retry:
    post:
      operationId: retryRun
      summary: Re-trigger a failed run (same agent_id/business_id â€” a fresh run, not a true replay)
      x-bap-permission: agents:trigger
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { description: "{ run_id (new), retried_from, agent_id, status: 'queued' }" }
        '422': { description: "Run is not 'failed' â€” only failed runs can be retried." }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/webhook:
    put:
      operationId: setWebhook
      summary: Configure or update this agent's webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webhook_url: { type: string, nullable: true }
                webhook_events: { type: array, items: { type: string } }
      responses:
        '200': { description: OK }
        '400': { description: "URL resolves to a private/reserved address (SSRF guard) or another validation failure." }

  /me/webhook/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List this agent's webhook delivery attempts
      responses:
        '200': { description: "{ deliveries: [...] }" }

  /me/webhook/deliveries/{deliveryId}/retry:
    post:
      operationId: retryWebhookDelivery
      summary: Retry a failed webhook delivery
      parameters: [{ name: deliveryId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  # â”€â”€ Phase 2: Goals â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /businesses/{businessId}/goals:
    get:
      operationId: listGoals
      summary: List goals â€” search, filter, paginate
      x-bap-permission: goals:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string }, description: "CSV; defaults to all non-cancelled goals." }
        - { name: tags, in: query, schema: { type: string }, description: "CSV." }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  goals: { type: array, items: { $ref: '#/components/schemas/Goal' } }
                  total: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      operationId: proposeGoal
      summary: Propose (create) a new goal
      x-bap-permission: goals:propose
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                deadline: { type: string, format: date-time }
                metric_name: { type: string, description: "If set with no metric_baseline, auto-filled from the latest matching metrics row." }
                metric_baseline: { type: number }
                metric_target: { type: number }
                metric_unit: { type: string }
                strategy: { type: string }
                project_id: { type: string }
                assigned_agents: { type: array, items: { type: string } }
                milestones: { type: array, items: { type: object } }
                tags: { type: array, items: { type: string } }
                owner: { type: string, description: "Phase 3." }
                confidence: { type: number, description: "Phase 3." }
                priority: { type: string, enum: [p1, p2, p3], default: p2, description: "Phase 3." }
                depends_on: { type: array, items: { type: string }, description: "Phase 3. Goal IDs this goal depends on â€” invalid/unknown IDs are silently dropped, not an error." }
      responses:
        '201': { description: "{ goal }" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /goals/{goalId}:
    get:
      operationId: getGoalDetail
      summary: Goal detail â€” progress, linked metrics/tasks/signals/outcomes, blockers, conflicts, strategic planning
      x-bap-permission: goals:read
      parameters: [{ name: goalId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal: { $ref: '#/components/schemas/Goal' }
                  linked_metrics: { type: object, nullable: true }
                  linked_tasks: { type: array, items: { type: object } }
                  linked_signals: { type: array, items: { type: object } }
                  linked_outcomes: { type: array, items: { type: object }, description: "Phase 3 â€” via task_outcomes.goal_id." }
                  progress:
                    type: object
                    properties:
                      progress_pct: { type: number }
                      last_checked: { type: string, format: date-time, nullable: true }
                      checks: { type: array, items: { type: object } }
                  blockers:
                    type: object
                    properties:
                      open_conflicts: { type: array, items: { $ref: '#/components/schemas/Conflict' } }
                      deadline_at_risk: { type: boolean }
                  conflicts: { type: array, items: { $ref: '#/components/schemas/Conflict' } }
                  strategic_planning:
                    type: object
                    description: "Phase 3 â€” summary; see GET /goals/{goalId}/assessment and /strategies for full detail."
                    properties:
                      latest_assessment: { allOf: [{ $ref: '#/components/schemas/GoalAssessment' }], nullable: true }
                      strategy_count: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
    patch:
      operationId: updateGoal
      summary: Update a goal (progress/status/metric/strategy/tags/etc)
      x-bap-permission: goals:update
      parameters:
        - { name: goalId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                status: { type: string, enum: [active, paused, achieved, missed, cancelled] }
                deadline: { type: string, format: date-time }
                metric_name: { type: string }
                metric_baseline: { type: number }
                metric_target: { type: number }
                metric_unit: { type: string }
                strategy: { type: string }
                project_id: { type: string }
                assigned_agents: { type: array, items: { type: string } }
                milestones: { type: array, items: { type: object } }
                notes: { type: array, items: { type: object } }
                tags: { type: array, items: { type: string } }
                owner: { type: string, description: "Phase 3." }
                confidence: { type: number, description: "Phase 3." }
                priority: { type: string, enum: [p1, p2, p3], description: "Phase 3." }
                depends_on: { type: array, items: { type: string }, description: "Phase 3. Replaces the goal's full dependency set (goal_dependencies) â€” not a merge." }
      responses:
        '200': { description: "{ goal }" }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /goals/{goalId}/archive:
    post:
      operationId: archiveGoal
      summary: Soft-cancel a goal (status -> cancelled)
      x-bap-permission: goals:update
      parameters:
        - { name: goalId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: "{ goal_id, status: 'cancelled' }" }
        '404': { $ref: '#/components/responses/NotFound' }

  /goals/{goalId}/check:
    post:
      operationId: checkGoal
      summary: Recompute a goal's progress against its current metric value now
      x-bap-permission: goals:update
      parameters:
        - { name: goalId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: "{ goal, check_result }" }
        '404': { $ref: '#/components/responses/NotFound' }

  /goals/{goalId}/conflicts:
    get:
      operationId: getGoalConflicts
      summary: Conflicts referencing this goal (goal-vs-goal, task-vs-goal)
      x-bap-permission: goals:read
      parameters: [{ name: goalId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "{ conflicts }" }
        '404': { $ref: '#/components/responses/NotFound' }

  # â”€â”€ Phase 3: Strategic Planning Engine + Multi-Strategy Planning â”€â”€â”€â”€â”€â”€â”€
  /goals/{goalId}/timeline:
    get:
      operationId: getGoalTimeline
      summary: Merged chronological event feed for a goal (created, checks, assessments, strategies, conflicts, decisions, achieved)
      x-bap-permission: goals:read
      parameters: [{ name: goalId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal_id: { type: string }
                  events: { type: array, items: { $ref: '#/components/schemas/TimelineEvent' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /goals/{goalId}/assessment:
    get:
      operationId: getGoalAssessment
      summary: Latest strategic feasibility assessment for a goal
      x-bap-permission: goals:read
      parameters: [{ name: goalId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessment: { $ref: '#/components/schemas/GoalAssessment' }
        '404': { description: "No assessment exists yet â€” trigger one with POST /goals/{goalId}/plan." }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /goals/{goalId}/assessments:
    get:
      operationId: listGoalAssessments
      summary: Full assessment history for a goal (one row per planning pass), newest first, paginated
      x-bap-permission: goals:read
      parameters:
        - { name: goalId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessments: { type: array, items: { $ref: '#/components/schemas/GoalAssessment' } }
                  total: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /goals/{goalId}/strategies:
    get:
      operationId: listGoalStrategies
      summary: Candidate strategies for a goal, comparable side-by-side
      x-bap-permission: goals:read
      parameters:
        - { name: goalId, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, default: candidate }, description: "e.g. candidate, selected, rejected." }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies: { type: array, items: { $ref: '#/components/schemas/GoalStrategy' } }
                  total: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /goals/{goalId}/plan:
    post:
      operationId: planGoal
      summary: (Re-)run strategic planning for a goal now
      x-bap-permission: goals:update
      description: >-
        Fire-and-forget â€” a fresh LLM-backed planning pass can take many
        seconds. Poll GET /goals/{goalId}/assessment and
        GET /goals/{goalId}/strategies for the result.
      parameters:
        - { name: goalId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { description: "{ goal_id, status: 'planning', message }" }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  # â”€â”€ Phase 3: Conflicts (general, business-wide) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /businesses/{businessId}/conflicts:
    get:
      operationId: listConflicts
      summary: List conflicts â€” every conflict_type, filterable, paginated
      x-bap-permission: conflicts:read
      description: >-
        The general, business-wide conflict surface (see also
        GET /goals/{goalId}/conflicts for the goal-scoped view). Read-only â€”
        resolving or dismissing a conflict remains a dashboard-only action.
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { type: string, default: open }, description: "'all' for resolved too." }
        - { name: conflict_type, in: query, schema: { type: string }, description: "CSV: goal_vs_goal, task_vs_window, task_vs_goal, task_vs_task, signal_vs_goal, goal_dependency." }
        - { name: category, in: query, schema: { type: string }, description: "CSV: direct, resource, timing, dependency. Phase 3 addition, orthogonal to conflict_type." }
        - { name: entity_id, in: query, schema: { type: string }, description: "Matches either entity_a_id or entity_b_id." }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts: { type: array, items: { $ref: '#/components/schemas/Conflict' } }
                  total: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }

  /conflicts/{conflictId}:
    get:
      operationId: getConflictDetail
      summary: Conflict detail
      x-bap-permission: conflicts:read
      parameters: [{ name: conflictId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflict: { $ref: '#/components/schemas/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  # â”€â”€ Phase 3: Opportunity Engine â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /businesses/{businessId}/opportunities:
    get:
      operationId: listOpportunities
      summary: List quantified opportunities â€” filterable, paginated
      x-bap-permission: opportunities:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { type: string, default: pending }, description: "CSV, or 'all'." }
        - { name: connector_source, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  opportunities: { type: array, items: { $ref: '#/components/schemas/Opportunity' } }
                  total: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }

  /opportunities/{opportunityId}:
    get:
      operationId: getOpportunityDetail
      summary: Opportunity detail
      x-bap-permission: opportunities:read
      parameters: [{ name: opportunityId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  opportunity: { $ref: '#/components/schemas/Opportunity' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /businesses/{businessId}/opportunities/scan:
    post:
      operationId: triggerOpportunityScan
      summary: Trigger a fresh opportunity scan now
      x-bap-permission: opportunities:trigger
      description: >-
        Fire-and-forget â€” an LLM-backed pattern scan over connector data.
        Poll GET /businesses/{businessId}/opportunities for results.
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { description: "{ business_id, status: 'scanning', message }" }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  # â”€â”€ Phase 3: Decision Memory (read-only) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /businesses/{businessId}/decisions:
    get:
      operationId: listDecisions
      summary: Recall decisions â€” search/filter/paginate
      x-bap-permission: decisions:read
      description: >-
        Read-only: decisions are written by the engines that make them
        (task-queue.ts, goal-reasoner.ts, conflict-engine.ts,
        goal-suggester.ts), never directly via BAP.
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: q, in: query, schema: { type: string }, description: "Searches title/decision/reasoning." }
        - { name: decision_type, in: query, schema: { type: string } }
        - { name: related_goal_id, in: query, schema: { type: string } }
        - { name: related_task_id, in: query, schema: { type: string } }
        - { name: date_from, in: query, schema: { type: string, format: date-time } }
        - { name: date_to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions: { type: array, items: { $ref: '#/components/schemas/Decision' } }
                  total: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '404': { $ref: '#/components/responses/NotFound' }

  /decisions/{decisionId}:
    get:
      operationId: getDecisionDetail
      summary: Decision detail
      x-bap-permission: decisions:read
      parameters: [{ name: decisionId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision: { allOf: [{ $ref: '#/components/schemas/Decision' }], nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  # â”€â”€ Phase 3: Knowledge Graph â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /businesses/{businessId}/graph:
    get:
      operationId: traverseGraph
      summary: Traverse the knowledge graph from a starting entity
      x-bap-permission: graph:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { name: ref_table, in: query, required: true, schema: { type: string, enum: [goals, tasks, signals, decisions, kg_entities] } }
        - { name: ref_id, in: query, required: true, schema: { type: string } }
        - { name: depth, in: query, schema: { type: integer, minimum: 1, maximum: 5, default: 2 } }
        - { name: edge_types, in: query, schema: { type: string }, description: "CSV of caused,supports,blocks,depends_on,relates_to,mentions,supersedes,contradicts,improves,regresses." }
      responses:
        '200':
          description: "OK. { nodes: [], edges: [] } if the starting entity has no graph node yet â€” not a 404."
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes: { type: array, items: { $ref: '#/components/schemas/GraphNode' } }
                  edges: { type: array, items: { $ref: '#/components/schemas/GraphEdge' } }
                  total_nodes: { type: integer }
                  total_edges: { type: integer }
        '400': { description: "Missing ref_table/ref_id, or ref_table outside the allowed set." }
        '404': { $ref: '#/components/responses/NotFound' }

  /businesses/{businessId}/graph/rebuild:
    post:
      operationId: rebuildGraph
      summary: Recompute every derivable edge for a business now
      x-bap-permission: graph:trigger
      description: >-
        Synchronous (200, not 202) â€” idempotent (upserts), safe to call
        repeatedly. Returns total entity/edge counts afterward, not how many
        changed.
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: "{ business_id, entities, edges }" }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  # â”€â”€ Phase 3: Review surfaces (recommendations, retrospectives, calibration, patterns) â”€
  /businesses/{businessId}/recommendations:
    get:
      operationId: listRecommendations
      summary: Ranked, explainable recommendations across tasks/opportunities/strategies
      x-bap-permission: recommendations:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendations: { type: array, items: { $ref: '#/components/schemas/Recommendation' } }
                  excluded: { type: array, items: { $ref: '#/components/schemas/ExcludedRecommendation' } }
                  explanation_depth: { type: string, description: "e.g. 'full for the top 5, partial (no KB search) for the rest'." }
                  total: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /businesses/{businessId}/retrospectives:
    get:
      operationId: listRetrospectives
      summary: List retrospectives, newest first, paginated
      x-bap-permission: retrospectives:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  retrospectives: { type: array, items: { $ref: '#/components/schemas/RetrospectiveSummary' } }
                  total: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }

  /retrospectives/{retrospectiveId}:
    get:
      operationId: getRetrospectiveDetail
      summary: Retrospective detail â€” full report
      x-bap-permission: retrospectives:read
      parameters: [{ name: retrospectiveId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  retrospective: { $ref: '#/components/schemas/RetrospectiveDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /businesses/{businessId}/retrospectives/run:
    post:
      operationId: runRetrospective
      summary: Trigger a retrospective now
      x-bap-permission: retrospectives:trigger
      description: >-
        Fire-and-forget â€” an LLM call over a month of data plus a KB write.
        Poll GET /businesses/{businessId}/retrospectives for the result.
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { description: "{ business_id, status: 'running', message }" }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /businesses/{businessId}/calibration:
    get:
      operationId: getCalibration
      summary: Agent calibration â€” latest per agent, or full history for one agent
      x-bap-permission: calibration:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: history, in: query, schema: { type: string }, description: "Any truthy value returns calibration_history (up to 50 rows) instead of the latest-per-agent list." }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      calibration: { type: array, items: { $ref: '#/components/schemas/CalibrationRow' } }
                      total: { type: integer }
                  - type: object
                    properties:
                      calibration_history: { type: array, items: { $ref: '#/components/schemas/CalibrationRow' } }

  /businesses/{businessId}/patterns:
    get:
      operationId: listCrossBusinessPatterns
      summary: Cross-business learning â€” abstracted patterns only, no tenant-identifying data
      x-bap-permission: recommendations:read
      description: "No separate patterns:read permission â€” reuses recommendations:read."
      parameters: [{ $ref: '#/components/parameters/BusinessIdPath' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  patterns: { type: array, items: { $ref: '#/components/schemas/CrossBusinessPattern' } }
                  total: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  # â”€â”€ Phase 2: Connectors â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /businesses/{businessId}/connectors:
    get:
      operationId: listConnectors
      summary: List connectors â€” status, freshness, config summary (no secrets)
      x-bap-permission: connectors:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors: { type: array, items: { $ref: '#/components/schemas/Connector' } }
                  total: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }

  /connectors/{connectorId}:
    get:
      operationId: getConnectorDetail
      summary: Connector detail â€” health, sync stats
      x-bap-permission: connectors:read
      parameters: [{ name: connectorId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "{ connector, sync_stats, metrics_stored }" }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  /connectors/{connectorId}/syncs:
    get:
      operationId: listConnectorSyncs
      summary: Sync history â€” filterable, paginated
      x-bap-permission: connectors:read
      parameters:
        - { name: connectorId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { type: string }, description: "CSV: running,complete,failed" }
      responses:
        '200': { description: "{ syncs, total, pagination }" }

  /connectors/{connectorId}/sync:
    post:
      operationId: triggerConnectorSync
      summary: Trigger a sync now
      x-bap-permission: connectors:sync
      parameters:
        - { name: connectorId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { description: "{ connector_id, status: 'syncing', message }" }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/PermissionDenied' }

  # â”€â”€ Phase 2: Outcomes â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /businesses/{businessId}/outcomes:
    get:
      operationId: listOutcomes
      summary: List outcomes across tasks with a target_metric â€” filterable by mapped status, action_type, proposed_by
      x-bap-permission: outcomes:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OutcomeStatus' } }
        - { name: action_type, in: query, schema: { type: string } }
        - { name: proposed_by, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcomes: { type: array, items: { $ref: '#/components/schemas/Outcome' } }
                  total: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }

  # â”€â”€ Phase 2: Audit â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /businesses/{businessId}/audit:
    get:
      operationId: listAuditEntries
      summary: Filterable, paginated audit trail (task/signal/business/connector/agent actions)
      x-bap-permission: audit:read
      parameters:
        - { $ref: '#/components/parameters/BusinessIdPath' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: entity_type, in: query, schema: { type: string }, description: "CSV, whitelisted: task,signal,business,connector,agent,agent_file,server_file" }
        - { name: entity_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string }, description: "CSV" }
        - { name: actor, in: query, schema: { type: string }, description: "CSV" }
        - { name: date_from, in: query, schema: { type: string, format: date-time } }
        - { name: date_to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  total: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { description: "entity_type contains a value outside the whitelist." }

  # â”€â”€ Operator-only (session auth, not part of the external-agent surface) â”€
  /agents-admin:
    get:
      operationId: listBapAgentsAdmin
      summary: "[Operator only] List all registered BAP agents"
      security: [{ sessionAuth: [] }]
      responses:
        '200': { description: OK }

  /agents-admin/{agentId}/revoke:
    post:
      operationId: revokeBapAgent
      summary: "[Operator only] Revoke a BAP agent's key"
      security: [{ sessionAuth: [] }]
      parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }

  /agents-admin/{agentId}/audit:
    get:
      operationId: getBapAgentAuditAdmin
      summary: "[Operator only] An agent's own bap_audit call log"
      security: [{ sessionAuth: [] }]
      parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "{ calls }" }

  /agents-admin/{agentId}/deliveries:
    get:
      operationId: getBapAgentDeliveriesAdmin
      summary: "[Operator only] An agent's webhook delivery history"
      security: [{ sessionAuth: [] }]
      parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: "{ deliveries }" }
