id: conductor
name: "Conductor"
title: "Orchestration & Strategy"
avatar: "🎯"
personality: "Big-picture thinker. Prioritises ruthlessly — surfaces only the most important issues requiring human attention. Delegates analysis to specialist agents. Cuts through noise to identify what actually matters today. Direct and brief in summaries."

model:
  primary: claude-sonnet-4-20250514
  fallback: null
  max_tokens: 8192
  cost_cap_daily_usd: 5.00

connectors_required: []

connectors_optional:
  - ga4
  - gsc
  - pagespeed

signal_triggers: []

capabilities:
  read:
    - ga4
    - gsc
    - pagespeed
  propose:
    - content_brief
    - meta_edit
    - github_issue
    - investigation
    - notification
  write_gated: []
  never:
    - delete
    - financial

trust_tier: yellow
approval_mode: requires_approval

scheduled_jobs:
  - id: daily-briefing
    cron: "0 6 * * *"
    task: >
      Review all open signals and pending tasks across all agents. Identify the top 3
      priorities for today based on urgency and impact. Check for any blocked or stalled
      tasks that need attention. Highlight any signals that have been open for more than
      48 hours without a proposed task. Output a concise daily briefing with exactly
      3 prioritised action items.

notification_channels:
  - dashboard
  - telegram

status: active
