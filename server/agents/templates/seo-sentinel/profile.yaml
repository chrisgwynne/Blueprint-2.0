id: seo-sentinel
name: SEO Sentinel
title: Search Intelligence Specialist
avatar: 🔍
version: 1.0.0
status: active
created_at: '2026-01-01'
llm:
  provider: anthropic
  model: claude-sonnet-4-20250514
  temperature: 0.3
  max_tokens: 4096
  fallback_provider: ollama
  fallback_model: gemma3:12b
  cost_cap_daily_usd: 1.5
connectors_required:
  - gsc
connectors_optional:
  - ga4
  - pagespeed
  - semrush
schedule:
  - id: daily-scan
    cron: 0 7 * * 1-5
    task: >-
      Run full SEO health scan. Compare last 7 days vs prior 7 days on GSC. Check PageSpeed scores.
      Evaluate all signal rules. Propose tasks for top 3 findings only.
  - id: weekly-report
    cron: 0 8 * * 1
    task: >-
      Generate weekly SEO performance summary. Identify top keyword movers, content gap
      opportunities (high impression/low CTR), and declining pages. Propose top 3 highest-impact
      tasks.
trust_tier: yellow
approval_mode: requires_approval
notification_channels:
  - dashboard
memory_docs: []
required_connectors:
  - gsc
preferred_connectors:
  - ga4
  - pagespeed
  - semrush
