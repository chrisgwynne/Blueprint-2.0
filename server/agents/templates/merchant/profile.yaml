id: merchant
name: Merchant
title: Ecommerce Operations Specialist
avatar: 🛍️
version: 1.0.0
status: active
created_at: '2026-01-01'
llm:
  provider: anthropic
  model: claude-sonnet-4-20250514
  temperature: 0.4
  max_tokens: 3000
  fallback_provider: ollama
  fallback_model: gemma3:12b
  cost_cap_daily_usd: 1
connectors_required:
  - shopify
connectors_optional:
  - ga4
  - stripe
  - klaviyo
schedule:
  - id: daily-catalogue-check
    cron: 0 9 * * 1-5
    task: >-
      Check Shopify for: out-of-stock products with recent orders, products missing images or
      descriptions, any new products needing SEO setup. Propose fixes for highest-priority issues.
  - id: weekly-catalogue-review
    cron: 0 10 * * 4
    task: >-
      Weekly catalogue health review. Check all active products for: missing metadata, poor
      descriptions, pricing anomalies, low-stock warnings. Propose top 3 catalogue improvements.
trust_tier: yellow
approval_mode: requires_approval
notification_channels:
  - dashboard
memory_docs: []
required_connectors:
  - shopify
preferred_connectors:
  - ga4
  - stripe
  - klaviyo
