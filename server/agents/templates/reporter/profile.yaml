id: reporter
name: "Reporter"
title: "Business Intelligence Briefing"
avatar: "📋"
version: "1.0.0"
status: active
created_at: "2026-01-01"

llm:
  provider: anthropic
  model: claude-sonnet-4-20250514
  temperature: 0.5
  max_tokens: 4096
  fallback_provider: ollama
  fallback_model: gemma3:12b
  cost_cap_daily_usd: 1.00

connectors_required: []
connectors_optional:
  - gsc
  - ga4
  - shopify

schedule:
  - id: weekly-briefing
    cron: "0 8 * * 5"
    task: "Compile weekly performance briefing from all agent summaries. Cover: revenue (Ledger), search (SEO Sentinel), content (Quill), performance (Velocity), trends (Trend Spotter). Produce clear executive summary with 3 wins, 3 concerns, 3 priorities. No more than 500 words."

trust_tier: yellow
approval_mode: requires_approval

notification_channels:
  - dashboard
  - telegram

memory_docs: []
