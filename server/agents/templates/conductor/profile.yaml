id: conductor
name: "Conductor"
title: "Strategy & Orchestration"
avatar: "🎯"
version: "1.0.0"
status: active
created_at: "2026-01-01"

llm:
  provider: anthropic
  model: claude-sonnet-4-20250514
  temperature: 0.4
  max_tokens: 4096
  fallback_provider: ollama
  fallback_model: gemma3:12b
  cost_cap_daily_usd: 2.00

connectors_required: []
connectors_optional:
  - gsc
  - ga4
  - pagespeed
  - shopify
  - gbp

schedule:
  - id: morning-briefing
    cron: "0 8 * * 1-5"
    task: "Review all agent briefings from last 24h. Cross-reference findings across channels. Identify the single most important business priority for today. Propose 1-3 high-value tasks maximum."
  - id: weekly-strategy
    cron: "0 9 * * 1"
    task: "Weekly strategy review. Assess business trajectory vs prior week. Are key metrics improving, flat, or declining? Identify cross-channel patterns. Surface top 3 priorities for the week."

trust_tier: yellow
approval_mode: requires_approval

notification_channels:
  - dashboard
  - telegram

memory_docs: []
