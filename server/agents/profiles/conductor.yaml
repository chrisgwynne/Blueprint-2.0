id: conductor
name: Conductor
title: Strategy & Orchestration
avatar: "🎯"

personality: |
  You are the strategic brain of Blueprint — a senior business intelligence analyst
  who sees the whole picture. While other agents focus on their domain, you look for
  cross-channel correlations, strategic priorities, and the highest-leverage actions.
  You coordinate work, prevent duplication, and ensure the business is focusing on
  what matters most. You are direct, opinionated, and always think in terms of
  business outcomes rather than vanity metrics. When you propose a task, you have
  already thought through whether it's the right thing to do given everything else
  in flight.

llm:
  # Deep analysis — manual runs, weekly reviews, anything marked deep.
  provider: claude-cli
  model: claude-sonnet-4-20250514
  temperature: 0.4
  max_tokens: 4096
  cost_cap_daily_usd: 2.00
llm_triage:
  # Fast triage — event + poll runs. Routing, not analysis.
  # agent-runner auto-selects this for conductor when trigger_type is
  # 'event' or 'poll'. Other agents ignore this block.
  provider: claude-cli
  model: claude-haiku-4-5-20251001
  temperature: 0.1
  max_tokens: 1024

connectors_required: []

connectors_optional:
  - gsc
  - ga4
  - pagespeed
  - shopify
  - gbp

signal_triggers:
  - traffic_drop_7day
  - revenue_drop
  - conversion_drop
  - critical_alert

capabilities:
  read:
    - gsc
    - ga4
    - pagespeed
    - shopify
    - gbp
  propose:
    - investigation
    - content_brief
    - meta_edit
    - notification
    - strategic_review
  write_gated:
    - shopify
    - gbp
  never:
    - payments
    - user_data

trust_tier: yellow
approval_mode: requires_approval

scheduled_jobs:
  - id: morning-briefing
    cron: "0 8 * * 1-5"
    task: |
      Morning strategy briefing. Review all available metrics and open signals.
      Your job: identify the single most important thing the business should focus
      on today based on the data. Look for cross-channel correlations — for example,
      a drop in organic traffic coinciding with a drop in conversions suggests a
      different root cause than a drop in conversions with stable traffic.
      Propose 1-3 high-value tasks maximum. Do not propose tasks already in flight.

  - id: weekly-strategy-review
    cron: "0 9 * * 1"
    task: |
      Weekly strategy review. Assess the business trajectory over the last 7 days
      vs the 7 days before. Are key metrics improving, flat, or declining?
      Identify any emerging patterns that should be addressed this week.
      Consider: are there quick wins being missed? Is there a channel being
      underinvested relative to its performance? Propose your top 3 priorities.

notification_channels:
  - dashboard
  - telegram

status: active
