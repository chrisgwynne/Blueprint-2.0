id: conductor
name: Conductor
title: Strategy & Orchestration
avatar: 🎯
version: 1.0.0
status: active
created_at: '2026-01-01'
llm:
  # Deep analysis — used for manual runs, scheduled weekly reviews, and any
  # trigger marked as deep/schedule. Slower + higher token budget.
  temperature: 0.4
  max_tokens: 4096
  cost_cap_daily_usd: 5.00
llm_triage:
  # Fast triage — used for event-driven and poll-driven runs where Conductor's
  # job is routing, not analysis. Cheaper model, tighter token budget, low
  # temperature for consistent routing decisions.
  # agent-runner auto-selects this for conductor when trigger_type is
  # 'event' or 'poll'. Any non-conductor agent ignores this block.
  temperature: 0.1
  max_tokens: 1024
connectors_required: []
connectors_optional:
  - gsc
  - ga4
  - pagespeed
  - shopify
  - gbp
schedule:
  - id: morning-briefing
    cron: 0 8 * * 1-5
    task: >-
      Review all agent briefings from last 24h. Cross-reference findings across channels. Identify the single most
      important business priority for today. Propose 1-3 high-value tasks maximum.
  - id: weekly-strategy
    cron: 0 9 * * 1
    task: >-
      Weekly strategy review. Assess business trajectory vs prior week. Are key metrics improving, flat, or declining?
      Identify cross-channel patterns. Surface top 3 priorities for the week.
trust_tier: yellow
approval_mode: requires_approval
notification_channels:
  - dashboard
  - telegram
memory_docs: []
